name: Deploy to Hetzner

# Since the 28 Oct 2026 cutover the site is static: site/ holds the finished pages, built locally by the site-v3
# build (python _build/build.py --production) and committed here. Nothing is built in CI; a push to main uploads site/.
# Files on the server that are not in site/ (the previous site, api/ config) are left in place; .htaccess redirects
# the retired routes.
#
# Only files changed since the last successful deploy are uploaded (.github/scripts/deploy-changed.sh). One deploy runs
# at a time; a newer push waits, and its diff starts from the commit the server last confirmed.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      base:
        description: "Upload everything changed since this commit (default: the commit recorded on the server)"
        required: false

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Upload changed files over SFTP
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USERNAME }}
          SSHPASS: ${{ secrets.HETZNER_PASSWORD }}
          REMOTE: /${{ secrets.HETZNER_REMOTE_PATH }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ inputs.base }}
        run: bash .github/scripts/deploy-changed.sh
