name: Deploy to Hetzner

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy over SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.HETZNER_USERNAME }}
          server: ${{ secrets.HETZNER_HOST }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          port: 22
          sftp_only: true
          local_path: './_site/*'
          remote_path: ${{ secrets.HETZNER_REMOTE_PATH }}
