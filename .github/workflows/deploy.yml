name: Deploy to Hetzner

# Since the 28 Oct 2026 cutover the site is static: site/ holds the finished pages, built locally by the site-v3
# build (python _build/build.py --production) and committed here. Nothing is built in CI; a push to main uploads site/.
# Files on the server that are not in site/ (the previous site, api/ config) are left in place; .htaccess redirects
# the retired routes.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy over SFTP
        uses: wangyucode/sftp-upload-action@v2.0.4
        with:
          host: ${{ secrets.HETZNER_HOST }}
          port: 22
          username: ${{ secrets.HETZNER_USERNAME }}
          password: ${{ secrets.HETZNER_PASSWORD }}
          localDir: 'site'
          remoteDir: '/${{ secrets.HETZNER_REMOTE_PATH }}'
