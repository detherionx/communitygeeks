<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Archivo', sans-serif" aria-label="Editorial illustration: a light register labelled SELECTED FUNCTIONS lists five illustrative organizational functions, community, devrel, product, marketing, and partnerships, followed by a plus and more, sitting directly above one continuous petrol field labelled PARTICIPATION that runs the full width, well beyond the register on both sides, expressing that participation is the larger, continuous phenomenon and these functions are only some of the territories it runs through.">

  <rect x="0" y="0" width="1000" height="300" fill="#F6F4EF"></rect>

  <!-- metadata label: explicitly names these as selected, not exhaustive -->
  <text x="60" y="66" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="11" letter-spacing="0.08em" fill="#B08D57">SELECTED FUNCTIONS</text>

  <!-- function register: a light rule-and-tick territory system, occupying
       ~68% of the width — not boxes, not table cells -->
  <line x1="60" y1="100" x2="740" y2="100" stroke="#1B1912" stroke-width="1.3"></line>
  <g stroke="#1B1912" stroke-width="1.3">
    <line x1="60"  y1="100" x2="60"  y2="114"></line>
    <line x1="190" y1="100" x2="190" y2="114"></line>
    <line x1="290" y1="100" x2="290" y2="114"></line>
    <line x1="410" y1="100" x2="410" y2="114"></line>
    <line x1="540" y1="100" x2="540" y2="114"></line>
    <line x1="740" y1="100" x2="740" y2="114"></line>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="12.5" letter-spacing="0.03em" fill="#1B1912" text-anchor="middle">
    <text x="125" y="136">COMMUNITY</text>
    <text x="240" y="136">DEVREL</text>
    <text x="350" y="136">PRODUCT</text>
    <text x="475" y="136">MARKETING</text>
    <text x="640" y="136">PARTNERSHIPS</text>
  </g>
  <text x="755" y="136" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="13" letter-spacing="0.03em" fill="#B08D57">+ AND MORE</text>

  <!-- participation: the dominant field, full-bleed, extending well beyond
       the function register on both sides; the word is centered on the
       register's own span (60–740), not the full canvas, so the
       alignment reads as deliberate rather than incidental -->
  <rect x="0" y="172" width="1000" height="90" fill="#1F4B4C"></rect>
  <text x="400" y="230" text-anchor="middle" font-weight="700" font-size="42" letter-spacing="0.01em" fill="#F6F4EF">PARTICIPATION</text>

</svg>
