<svg viewBox="0 0 900 930" xmlns="http://www.w3.org/2000/svg" role="img" font-family="Archivo, sans-serif" aria-label="Diagram: four interlocking fields — Identify, Understand, Shape, Strengthen — whose shared edges form one continuous loop with no privileged start and no fixed direction, framed as a possible lens for ecosystem work rather than a fixed method. Source: conversation with Andy Claremont, Head of Ecosystem and Community, Glide.">

  <rect x="0" y="0" width="900" height="930" fill="#F6F4EF"></rect>

  <!-- baked-in caption block -->
  <text x="60" y="34" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="700" letter-spacing="0.08em" fill="#B08D57">FIELD NOTE &#183; A POSSIBLE LENS</text>
  <line x1="60" y1="42" x2="230" y2="42" stroke="#B08D57" stroke-width="2"></line>
  <text x="60" y="72" font-family="Archivo, sans-serif" font-weight="700" font-size="25" fill="#1B1912">Identify. Understand. Shape. Strengthen.</text>
  <text x="60" y="98" font-size="14" fill="#4A473E">A possible lens for ecosystem work, not a fixed four-step method —</text>
  <text x="60" y="116" font-size="14" fill="#4A473E">read it as a continuous loop, and start wherever makes sense.</text>

  <!-- IDENTIFY: tall column, left, full height -->
  <rect x="60" y="170" width="270" height="630" fill="#F6F4EF" stroke="#1B1912" stroke-width="2.5"></rect>

  <!-- UNDERSTAND: wide band, top-right — the one solid flat-fill field -->
  <rect x="330" y="170" width="510" height="210" fill="#1F4B4C"></rect>

  <!-- SHAPE: right column, below Understand -->
  <rect x="590" y="380" width="250" height="420" fill="#F6F4EF" stroke="#1B1912" stroke-width="1.5"></rect>

  <!-- STRENGTHEN: middle block — the one with an ochre accent corner -->
  <rect x="330" y="380" width="260" height="170" fill="#F6F4EF" stroke="#1B1912" stroke-width="1.5"></rect>
  <rect x="330" y="380" width="18" height="18" fill="#B08D57"></rect>

  <!-- the loop: the four fields' own outer boundary is the connecting rule —
       no separate decorative line layered on top. Tracing it from any point
       leads through all four fields and back to the start. -->
  <path d="M330,170 L840,170 L840,800 L590,800 L590,550 L330,550 Z"
        fill="none" stroke="#1F4B4C" stroke-width="4" opacity="0.95"></path>
  <path d="M330,170 L60,170 L60,800 L330,800 Z"
        fill="none" stroke="#1F4B4C" stroke-width="4" opacity="0.95"></path>

  <!-- verb names: large type integrated directly into each field -->
  <g transform="rotate(-90 195 485)">
    <text x="195" y="485" text-anchor="middle" font-weight="800" font-size="46" letter-spacing="0.01em" fill="#1B1912">IDENTIFY</text>
  </g>
  <text x="195" y="770" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#4A473E">which groups actually matter</text>

  <text x="585" y="290" text-anchor="middle" font-weight="800" font-size="46" letter-spacing="0.01em" fill="#F6F4EF">UNDERSTAND</text>
  <text x="585" y="345" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11.5" fill="#F6F4EF" opacity="0.75">how they relate to each other</text>

  <text x="715" y="600" text-anchor="middle" font-weight="800" font-size="30" letter-spacing="0.01em" fill="#1B1912">SHAPE</text>
  <text x="715" y="625" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4A473E">programs that support</text>
  <text x="715" y="641" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4A473E">each group</text>

  <text x="460" y="450" text-anchor="middle" font-weight="800" font-size="24" letter-spacing="0.01em" fill="#1B1912">STRENGTHEN</text>
  <text x="460" y="472" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#4A473E">the ties already there</text>

  <!-- annotation: integrated at the interior gap where three of the four
       fields meet, not floating outside the composition -->
  <text x="460" y="640" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="13" font-weight="700" letter-spacing="0.05em" fill="#B08D57">A POSSIBLE LENS</text>
  <text x="460" y="662" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#4A473E">READ IN ANY ORDER</text>
  <text x="460" y="678" text-anchor="middle" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#4A473E">NOT A FIXED SEQUENCE</text>

  <!-- legend -->
  <line x1="60" y1="836" x2="82" y2="836" stroke="#1F4B4C" stroke-width="4" opacity="0.95"></line>
  <text x="92" y="840" font-family="'IBM Plex Mono', monospace" font-size="11" font-weight="600" fill="#1B1912">loop — the fields' own shared edges; no fixed direction, no fixed start</text>

  <line x1="60" y1="862" x2="900" y2="862" stroke="#D9D4C8" stroke-width="1"></line>
  <text x="60" y="888" font-family="'IBM Plex Mono', monospace" font-size="10.5" fill="#4A473E">Source: conversation with Andy Claremont, Head of Ecosystem &amp; Community, Glide — Communitygeeks Field Note, Aug 2026.</text>
</svg>
