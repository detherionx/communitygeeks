<svg viewBox="0 0 350 420" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Archivo', sans-serif" aria-label="Editorial illustration: a light register labelled SELECTED FUNCTIONS lists five illustrative organizational functions — community, devrel, product, marketing, and partnerships — followed by a plus and more, sitting directly above one continuous petrol field labelled PARTICIPATION that runs the full width, expressing that participation is the larger, continuous phenomenon and these functions are only some of the territories it runs through.">

  <rect x="0" y="0" width="350" height="420" fill="#F6F4EF"></rect>

  <text x="20" y="34" font-family="'IBM Plex Mono', monospace" font-weight="600" font-size="11" letter-spacing="0.08em" fill="#B08D57">SELECTED FUNCTIONS</text>

  <!-- function register: the same rule-and-tick territory system, rotated to
       a vertical spine so it fits a narrow column -->
  <line x1="30" y1="55" x2="30" y2="275" stroke="#1B1912" stroke-width="1.3"></line>
  <g stroke="#1B1912" stroke-width="1.3">
    <line x1="30" y1="55"  x2="44" y2="55"></line>
    <line x1="30" y1="99"  x2="44" y2="99"></line>
    <line x1="30" y1="143" x2="44" y2="143"></line>
    <line x1="30" y1="187" x2="44" y2="187"></line>
    <line x1="30" y1="231" x2="44" y2="231"></line>
    <line x1="30" y1="275" x2="44" y2="275"></line>
  </g>
  <g font-family="'IBM Plex Mono', monospace" font-weight="500" font-size="13" letter-spacing="0.03em" fill="#1B1912">
    <text x="54" y="81">COMMUNITY</text>
    <text x="54" y="125">DEVREL</text>
    <text x="54" y="169">PRODUCT</text>
    <text x="54" y="213">MARKETING</text>
    <text x="54" y="257">PARTNERSHIPS</text>
  </g>
  <text x="30" y="300" font-family="'IBM Plex Mono', monospace" font-weight="700" font-size="13" letter-spacing="0.03em" fill="#B08D57">+ AND MORE</text>

  <!-- participation: the dominant field, full-bleed -->
  <rect x="0" y="330" width="350" height="70" fill="#1F4B4C"></rect>
  <text x="175" y="376" text-anchor="middle" font-weight="700" font-size="26" letter-spacing="0.01em" fill="#F6F4EF">PARTICIPATION</text>

</svg>
