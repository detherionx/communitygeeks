<svg width="93" height="24" viewBox="0 0 93 24" fill="none" xmlns="http://www.w3.org/2000/svg">
<!-- Combined from DeepL's two current official assets (deepl.com/en/press):
     deepl-logo-blue.svg (icon) + deepl-logo-text-blue.svg (wordmark).
     They were never provided as a single combined file, so this positions
     the two real, current, matching-color (#0F2B46) assets together;
     see HANDOFF.md for why this replaced the wordmark-only version.

     2026-08-30: the icon's interior detail (three dots + the connecting
     arrow) was originally drawn as opaque white fills laid over the opaque
     navy hexagon. That's invisible to CSS mask-image, which reads alpha
     only — white-on-navy are both fully opaque, so every consumer of this
     file via .logo-mono (the sitewide monochrome-silhouette technique, see
     HANDOFF.md §14/15 — this file is never displayed with its own colors
     anywhere on the site) rendered the whole hexagon as one solid blob,
     losing the interior linework. Fixed with a real SVG <mask> so those
     regions are true alpha cutouts: white shapes in the mask keep the navy
     fill, black shapes punch an actual hole through it. If this file is
     ever replaced with a fresh export from DeepL, check whether the new
     asset already encodes the interior as real transparency (most vector
     icon exports do) before assuming this mask is still needed. -->
