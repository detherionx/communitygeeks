<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="Archivo, sans-serif">

  <rect x="0" y="0" width="1200" height="630" fill="#F6F4EF"/>

  <!-- constructed geometric field, right side: one black plane, one ochre
       structural tick — the same "ink block + brass edge" device already
       used for the product/company anchors elsewhere on the site -->
  <rect x="800" y="0" width="400" height="630" fill="#1B1912"/>
  <rect x="800" y="0" width="14" height="630" fill="#B08D57"/>

  <!-- node-mark, used here exactly as everywhere else on the site: a small
       secondary signature, not the primary composition -->
  <g transform="translate(966,556) scale(2.1)">
    <rect x="2" y="2" width="14" height="14" fill="#B08D57"/>
    <rect x="17" y="6" width="9" height="10" fill="none" stroke="#F6F4EF" stroke-width="1.6"/>
  </g>

  <!-- kicker: small mark + tracked label + thin rule, matching the site's
       own section-marker convention -->
  <g transform="translate(80,84) scale(1.3)">
    <rect x="2" y="2" width="14" height="14" fill="#1F4B4C"/>
    <rect x="17" y="6" width="9" height="10" fill="none" stroke="#1B1912" stroke-width="1.6"/>
  </g>
  <text x="122" y="102" font-family="'IBM Plex Mono', monospace" font-size="21" font-weight="700" letter-spacing="0.12em" fill="#B08D57">COMMUNITYGEEKS</text>
  <line x1="80" y1="122" x2="330" y2="122" stroke="#1B1912" stroke-width="2.5"/>

  <!-- headline: large asymmetric two-tone hierarchy -->
  <text x="78" y="290" font-weight="800" font-size="88" letter-spacing="-0.01em" fill="#1B1912">Participation</text>
  <text x="78" y="392" font-weight="800" font-size="72" letter-spacing="-0.005em" fill="#1F4B4C">Research &amp;</text>
  <text x="78" y="470" font-weight="800" font-size="72" letter-spacing="-0.005em" fill="#1F4B4C">Advisory</text>

  <!-- supporting line -->
  <text x="80" y="546" font-family="'IBM Plex Mono', monospace" font-size="22" letter-spacing="0.07em" fill="#4A473E">COMMUNITY &#183; DEVREL &#183; PARTNERSHIPS</text>

</svg>
